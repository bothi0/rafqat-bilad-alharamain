<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حسابي - رفقة بلاد الحرمين</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="app-header">
        <h2>حساب الحاج</h2>
        <span class="sub-title">الملف الشخصي وإدارة البيانات</span>
    </header>

    <div class="app-content">
        <div class="housing-card" style="text-align: center;">
            <div class="gold-circle-logo" style="margin: 0 auto 15px auto;">
                <i class="fa-solid fa-user"></i>
            </div>
            <h3 id="displayName">اسم الحاج الكريم</h3>
            <p class="address">رقم الحاج: #583879</p>
            <p class="date-badge" id="displayCampaign">حملة بلاد الحرمين</p>
        </div>

        <div class="housing-card">
            <h3>معلومات التواصل والمرشد</h3>
            <div class="info-grid">
                <div class="info-box">
                    <span class="info-label">رقم الجوال</span>
                    <span class="info-value" id="displayPhone">0538794980</span>
                </div>
                <div class="info-box">
                    <span class="info-label">المرشد المسؤول</span>
                    <span class="info-value" id="displayGuide">الشيخ عبد الله</span>
                </div>
            </div>
        </div>

        <!-- زر فتح نافذة التعديل -->
        <button onclick="openEditModal()" class="btn-bus-schedule" style="width: 100%; border: none; cursor: pointer; margin-bottom: 10px; background: #0f3833; color: white;">
            <i class="fa-solid fa-pen-to-square"></i> تعديل بيانات الحاج والحملة
        </button>

        <a href="index.html" class="btn-bus-schedule" style="display: block; text-align: center; text-decoration: none; background: #c5a059; color: #0f3833;">تسجيل الخروج</a>
    </div>

    <!-- نافذة تعديل البيانات المنبثقة -->
    <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; padding: 20px;">
        <div style="background: #fff; width: 100%; max-width: 400px; border-radius: 14px; padding: 20px; text-align: right;">
            <h3 style="color: #0f3833; margin-top:0;">تعديل الملف الشخصي</h3>
            
            <label style="font-size: 11px; font-weight: bold; color: #0f3833;">اسم الحاج:</label>
            <input type="text" id="inputName" value="اسم الحاج الكريم" style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">

            <label style="font-size: 11px; font-weight: bold; color: #0f3833;">اسم الحملة:</label>
            <input type="text" id="inputCampaign" value="حملة بلاد الحرمين" style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">

            <label style="font-size: 11px; font-weight: bold; color: #0f3833;">اسم المرشد المسؤول:</label>
            <input type="text" id="inputGuide" value="الشيخ عبد الله" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 6px;">

            <button onclick="saveProfile()" style="background: #0f3833; color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold;">حفظ التعديلات</button>
            <button onclick="closeEditModal()" style="background: #e53e3e; color: white; border: none; padding: 8px; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 5px;">إغلاق</button>
        </div>
    </div>

    <!-- الشريط السفلي -->
    <nav class="bottom-nav">
        <a href="account.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>حسابي</span></a>
        <a href="services.html" class="nav-item"><i class="fa-solid fa-concierge-bell"></i><span>الخدمات</span></a>
        <a href="housing.html" class="nav-item"><i class="fa-solid fa-hotel"></i><span>السكن</span></a>
        <a href="schedule.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i><span>الجدول</span></a>
        <a href="notifications.html" class="nav-item"><i class="fa-solid fa-bell"></i><span>التنبيهات</span></a>
    </nav>

    <script>
        function openEditModal() { document.getElementById('editModal').style.display = 'flex'; }
        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }
        function saveProfile() {
            document.getElementById('displayName').innerText = document.getElementById('inputName').value;
            document.getElementById('displayCampaign').innerText = document.getElementById('inputCampaign').value;
            document.getElementById('displayGuide').innerText = document.getElementById('inputGuide').value;
            closeEditModal();
            alert('تم تحديث البيانات بنجاح!');
        }
    </script>
</body>
</html>
